# Base H2 en memoria para pruebas de integración (sin Oracle)
spring.datasource.url=jdbc:h2:mem:sigprotest;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Valores minimos para que @Value en EmailService no falle (JavaMailSender se mockea en la prueba)
spring.mail.host=127.0.0.1
spring.mail.port=25
spring.mail.username=test@localhost

